[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-analytics-agent"
version = "0.1.0"
description = "A LangGraph marketing analytics workflow with guarded SQL and deterministic statistical validation"
requires-python = ">=3.11"
dependencies = [
  "sqlglot>=26,<30", "scipy>=1.14,<2", "langgraph>=1,<2",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
analytics-agent = "analytics_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
